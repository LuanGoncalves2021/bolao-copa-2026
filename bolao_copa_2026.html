<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Bolão Copa 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --verde-escuro: #0A3D1F;
            --verde-medio: #0F5C2E;
            --verde-claro: #1A7A3E;
            --dourado: #F5C518;
            --dourado-escuro: #C9A000;
            --branco: #F0F4F0;
            --cinza: #8BA89A;
            --erro: #E74C3C;
            --vencedor: #27AE60;
            --empate: #8E44AD;
            --card-bg: rgba(15, 92, 46, 0.5);
            --border: rgba(245, 197, 24, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--verde-escuro);
            color: var(--branco);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(245, 197, 24, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(26, 122, 62, 0.08) 0%, transparent 60%),
                repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(245, 197, 24, 0.015) 40px, rgba(245, 197, 24, 0.015) 41px);
            pointer-events: none;
            z-index: 0;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 61, 31, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 24px;
        }

        .logo-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            color: var(--dourado);
            letter-spacing: 2px;
        }

        .logo-sub {
            font-size: 11px;
            color: var(--cinza);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .update-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 197, 24, 0.1);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 12px;
            color: var(--dourado);
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dourado);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        /* NAV TABS */
        nav {
            background: rgba(10, 61, 31, 0.8);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            position: sticky;
            top: 60px;
            z-index: 99;
            backdrop-filter: blur(8px);
        }

        .nav-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-inner::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--cinza);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: all 0.2s;
            user-select: none;
        }

        .tab:hover {
            color: var(--branco);
        }

        .tab.ativo {
            color: var(--dourado);
            border-bottom-color: var(--dourado);
        }

        /* MAIN */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        .page {
            display: none;
        }

        .page.ativo {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CARDS */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
            backdrop-filter: blur(8px);
        }

        .card-label {
            font-size: 11px;
            color: var(--cinza);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .card-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            color: var(--dourado);
            line-height: 1;
            margin-bottom: 4px;
        }

        .card-sub {
            font-size: 12px;
            color: var(--cinza);
        }

        /* TABELAS */
        .table-wrap {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(8px);
            margin-bottom: 20px;
        }

        .table-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 16px;
            color: var(--dourado);
            letter-spacing: 1px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: rgba(10, 61, 31, 0.8);
            color: var(--cinza);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 16px;
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid rgba(245, 197, 24, 0.06);
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: rgba(245, 197, 24, 0.04);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody td {
            padding: 12px 16px;
            font-size: 13px;
            color: var(--branco);
        }

        .pos-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            color: var(--cinza);
            width: 40px;
        }

        .pos-1 {
            color: #FFD700;
        }

        .pos-2 {
            color: #C0C0C0;
        }

        .pos-3 {
            color: #CD7F32;
        }

        .nome-cell {
            font-weight: 500;
        }

        .pts-cell {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            color: var(--dourado);
        }

        /* BADGES */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .b-exato {
            background: var(--dourado);
            color: var(--verde-escuro);
        }

        .b-venc {
            background: var(--vencedor);
            color: white;
        }

        .b-empate {
            background: var(--empate);
            color: white;
        }

        .b-erro {
            background: rgba(231, 76, 60, 0.3);
            color: #E74C3C;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .b-enc {
            background: rgba(39, 174, 96, 0.2);
            color: #27AE60;
            border: 1px solid rgba(39, 174, 96, 0.3);
        }

        .b-agu {
            background: rgba(245, 197, 24, 0.1);
            color: var(--dourado);
            border: 1px solid var(--border);
        }

        /* JOGO CARDS */
        .jogo-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .jogo-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(245, 197, 24, 0.08);
            cursor: pointer;
            user-select: none;
        }

        .jogo-card-header:hover {
            background: rgba(245, 197, 24, 0.03);
        }

        .jogo-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .jogo-id-badge {
            background: rgba(10, 61, 31, 0.8);
            color: var(--cinza);
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .jogo-times {
            font-weight: 500;
            font-size: 14px;
        }

        .jogo-placar-real {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            color: var(--dourado);
            letter-spacing: 2px;
        }

        .jogo-stats {
            display: flex;
            gap: 12px;
            padding: 8px 16px;
            border-bottom: 1px solid rgba(245, 197, 24, 0.06);
            flex-wrap: wrap;
        }

        .jogo-stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--cinza);
        }

        .participantes-lista {
            display: none;
            padding: 8px 0;
        }

        .participantes-lista.aberto {
            display: block;
        }

        .part-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid rgba(245, 197, 24, 0.04);
            font-size: 13px;
        }

        .part-row:last-child {
            border-bottom: none;
        }

        .part-row:nth-child(even) {
            background: rgba(0, 0, 0, 0.1);
        }

        .part-nome {
            color: var(--branco);
            font-weight: 400;
        }

        .part-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .part-palpite {
            color: var(--cinza);
            font-size: 12px;
        }

        /* LOADING */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--cinza);
            gap: 12px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--dourado);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* FILTROS */
        .filtros-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filtro-label {
            font-size: 12px;
            color: var(--cinza);
        }

        .filtro-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--cinza);
            border-radius: 999px;
            padding: 5px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .filtro-btn:hover {
            color: var(--branco);
            border-color: rgba(245, 197, 24, 0.4);
        }

        .filtro-btn.ativo {
            background: var(--dourado);
            color: var(--verde-escuro);
            border-color: var(--dourado);
            font-weight: 600;
        }

        /* TV MODE */
        .tv-btn {
            background: rgba(245, 197, 24, 0.1);
            border: 1px solid var(--border);
            color: var(--dourado);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .tv-btn:hover {
            background: rgba(245, 197, 24, 0.2);
        }

        /* GRID 2 COLUNAS */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .barras-wrap {
            padding: 16px;
        }

        .barra-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .barra-nome {
            font-size: 12px;
            color: var(--branco);
            width: 110px;
            flex-shrink: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .barra-track {
            flex: 1;
            background: rgba(10, 61, 31, 0.8);
            border-radius: 4px;
            height: 20px;
            overflow: hidden;
        }

        .barra-fill {
            height: 100%;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding-left: 8px;
            transition: width 0.6s ease;
        }

        .barra-pct {
            font-size: 11px;
            font-weight: 600;
            color: var(--verde-escuro);
        }

        /* ERRO */
        .erro-msg {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            color: #E74C3C;
            margin-bottom: 16px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            main {
                padding: 12px;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }

            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .jogo-times {
                font-size: 12px;
            }

            .header-inner {
                gap: 12px;
            }

            .logo-sub {
                display: none;
            }
        }

        /* TV MODE FULLSCREEN */
        body.tv-mode header,
        body.tv-mode nav {
            display: none;
        }

        body.tv-mode main {
            padding: 16px;
            max-width: 100%;
        }

        body.tv-mode .card-value {
            font-size: 48px;
        }

        body.tv-mode tbody td {
            font-size: 16px;
            padding: 16px;
        }

        body.tv-mode .pts-cell {
            font-size: 28px;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">⚽</span>
                <div>
                    <div class="logo-text">Bolão Copa 2026</div>
                    <div class="logo-sub">Acompanhe ao vivo</div>
                </div>
            </div>
            <div style="display:flex;gap:10px;align-items:center;">
                <div class="update-badge">
                    <span class="dot"></span>
                    <span id="ultimo-update">Atualizando...</span>
                </div>
                <button class="tv-btn" onclick="toggleTV()">📺 Modo TV</button>
            </div>
        </div>
    </header>

    <nav>
        <div class="nav-inner">
            <div class="tab ativo" onclick="trocarPagina('ranking', this)">🏆 Ranking</div>
            <div class="tab" onclick="trocarPagina('jogos', this)">⚽ Jogos</div>
            <div class="tab" onclick="trocarPagina('detalhes', this)">🎯 Detalhes por Jogo</div>
            <div class="tab" onclick="trocarPagina('stats', this)">📊 Estatísticas</div>
        </div>
    </nav>

    <main>

        <!-- RANKING -->
        <div id="page-ranking" class="page ativo">
            <div id="ranking-cards" class="cards-grid"></div>
            <div class="table-wrap">
                <div class="table-header">
                    <span class="table-title">🏆 Ranking ao Vivo</span>
                    <span style="font-size:12px;color:var(--cinza)" id="ranking-count"></span>
                </div>
                <div id="ranking-table">
                    <div class="loading">
                        <div class="spinner"></div><span>Carregando ranking...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- JOGOS -->
        <div id="page-jogos" class="page">
            <div class="filtros-row">
                <span class="filtro-label">Grupo:</span>
                <button class="filtro-btn ativo" onclick="filtrarJogos('todos', this)">Todos</button>
                <button class="filtro-btn" onclick="filtrarJogos('A', this)">A</button>
                <button class="filtro-btn" onclick="filtrarJogos('B', this)">B</button>
                <button class="filtro-btn" onclick="filtrarJogos('C', this)">C</button>
                <button class="filtro-btn" onclick="filtrarJogos('D', this)">D</button>
                <button class="filtro-btn" onclick="filtrarJogos('E', this)">E</button>
                <button class="filtro-btn" onclick="filtrarJogos('F', this)">F</button>
                <button class="filtro-btn" onclick="filtrarJogos('G', this)">G</button>
                <button class="filtro-btn" onclick="filtrarJogos('H', this)">H</button>
                <button class="filtro-btn" onclick="filtrarJogos('I', this)">I</button>
                <button class="filtro-btn" onclick="filtrarJogos('J', this)">J</button>
                <button class="filtro-btn" onclick="filtrarJogos('K', this)">K</button>
                <button class="filtro-btn" onclick="filtrarJogos('L', this)">L</button>
                <button class="filtro-btn" onclick="filtrarJogos('ENCERRADO', this)">✅ Encerrados</button>
                <button class="filtro-btn" onclick="filtrarJogos('AGUARDANDO', this)">⏳ Próximos</button>
            </div>
            <div id="jogos-lista">
                <div class="loading">
                    <div class="spinner"></div><span>Carregando jogos...</span>
                </div>
            </div>
        </div>

        <!-- DETALHES POR JOGO -->
        <div id="page-detalhes" class="page">
            <div class="filtros-row">
                <span class="filtro-label">Filtrar:</span>
                <button class="filtro-btn ativo" onclick="filtrarDetalhes('todos', this)">Todos</button>
                <button class="filtro-btn" onclick="filtrarDetalhes('ENCERRADO', this)">✅ Encerrados</button>
            </div>
            <div id="detalhes-lista">
                <div class="loading">
                    <div class="spinner"></div><span>Carregando detalhes...</span>
                </div>
            </div>
        </div>

        <!-- STATS -->
        <div id="page-stats" class="page">
            <div id="stats-cards" class="cards-grid"></div>
            <div class="grid-2">
                <div class="table-wrap">
                    <div class="table-header"><span class="table-title">📊 Tabela de Estatísticas</span></div>
                    <div id="stats-table">
                        <div class="loading">
                            <div class="spinner"></div><span>Carregando...</span>
                        </div>
                    </div>
                </div>
                <div class="table-wrap">
                    <div class="table-header"><span class="table-title">🎯 Taxa de Acerto</span></div>
                    <div class="barras-wrap" id="stats-barras"></div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // ============================================================
        // CONFIGURAÇÃO — URLs do Google Sheets
        // ============================================================
        const URLS = {
            ranking: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcG82KK6wU_hEk9vR37D0VV4isIofJM0P_mIVjveAIgrU-HJBYPaK-ar4WTP9qVBEa9tX3UEReaxXw/pub?gid=2014570735&single=true&output=csv',
            pontuacao: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcG82KK6wU_hEk9vR37D0VV4isIofJM0P_mIVjveAIgrU-HJBYPaK-ar4WTP9qVBEa9tX3UEReaxXw/pub?gid=1413354047&single=true&output=csv',
            jogos: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcG82KK6wU_hEk9vR37D0VV4isIofJM0P_mIVjveAIgrU-HJBYPaK-ar4WTP9qVBEa9tX3UEReaxXw/pub?gid=2095654104&single=true&output=csv',
            stats: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcG82KK6wU_hEk9vR37D0VV4isIofJM0P_mIVjveAIgrU-HJBYPaK-ar4WTP9qVBEa9tX3UEReaxXw/pub?gid=1813151195&single=true&output=csv'
        };

        const INTERVAL = 2 * 60 * 1000; // 2 minutos

        // ============================================================
        // CSV PARSER
        // ============================================================
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            return lines.slice(1).map(line => {
                const vals = line.match(/(".*?"|[^,]+|(?<=,)(?=,)|^(?=,)|(?<=,)$)/g) || [];
                const obj = {};
                headers.forEach((h, i) => {
                    obj[h] = (vals[i] || '').trim().replace(/^"|"$/g, '');
                });
                return obj;
            });
        }

        async function fetchCSV(url) {
            const r = await fetch(url + '&t=' + Date.now());
            return parseCSV(await r.text());
        }

        // ============================================================
        // STATE
        // ============================================================
        let DATA = { ranking: [], pontuacao: [], jogos: [], stats: [] };
        let filtroJogos = 'todos';
        let filtroDetalhes = 'todos';

        // ============================================================
        // RENDER RANKING
        // ============================================================
        function renderRanking() {
            const d = DATA.ranking;
            if (!d.length) return;

            const total = d.length;
            const lider = d[0];
            const jogosEnc = DATA.jogos.filter(j => j.status === 'ENCERRADO').length;

            document.getElementById('ranking-cards').innerHTML = `
    <div class="card">
      <div class="card-label">👥 Participantes</div>
      <div class="card-value">${total}</div>
      <div class="card-sub">no bolão</div>
    </div>
    <div class="card">
      <div class="card-label">🥇 Líder</div>
      <div class="card-value">${lider.total_pontos || 0}<span style="font-size:16px;color:var(--cinza)">pts</span></div>
      <div class="card-sub">${lider.nome || '-'}</div>
    </div>
    <div class="card">
      <div class="card-label">⚽ Jogos encerrados</div>
      <div class="card-value">${jogosEnc}</div>
      <div class="card-sub">de 72 jogos</div>
    </div>
    <div class="card">
      <div class="card-label">🎯 Maior pontuação</div>
      <div class="card-value">${lider.total_pontos || 0}</div>
      <div class="card-sub">pontos</div>
    </div>
  `;

            document.getElementById('ranking-count').textContent = total + ' participantes';

            let rows = d.map((p, i) => {
                const pos = parseInt(p.posicao) || (i + 1);
                const posClass = pos === 1 ? 'pos-1' : pos === 2 ? 'pos-2' : pos === 3 ? 'pos-3' : '';
                const medal = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : '';
                return `<tr>
      <td class="pos-num ${posClass}">${medal || pos}</td>
      <td class="nome-cell">${p.nome || '-'}</td>
      <td class="pts-cell">${p.total_pontos || 0}</td>
      <td style="color:var(--cinza);font-size:12px">${p.jogos_pontuados || 0} acertos</td>
    </tr>`;
            }).join('');

            document.getElementById('ranking-table').innerHTML = `
    <table>
      <thead><tr>
        <th style="width:50px">#</th>
        <th>Nome</th>
        <th>Pontos</th>
        <th>Acertos</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
        }

        // ============================================================
        // RENDER JOGOS
        // ============================================================
        function renderJogos() {
            const jogos = DATA.jogos;
            let filtrados = jogos;

            if (filtroJogos === 'ENCERRADO' || filtroJogos === 'AGUARDANDO') {
                filtrados = jogos.filter(j => j.status === filtroJogos);
            } else if (filtroJogos !== 'todos') {
                filtrados = jogos.filter(j => j.grupo === filtroJogos);
            }

            if (!filtrados.length) {
                document.getElementById('jogos-lista').innerHTML = '<div class="loading"><span>Nenhum jogo encontrado.</span></div>';
                return;
            }

            const html = filtrados.map(j => {
                const enc = j.status === 'ENCERRADO';
                const badge = enc
                    ? '<span class="badge b-enc">✅ Encerrado</span>'
                    : '<span class="badge b-agu">⏳ Aguardando</span>';
                const placar = enc
                    ? `<span class="jogo-placar-real">${j.gols_1} x ${j.gols_2}</span>`
                    : `<span style="color:var(--cinza);font-size:13px">${j.horario || ''}</span>`;

                return `<div class="jogo-card">
      <div class="jogo-card-header">
        <div class="jogo-info">
          <span class="jogo-id-badge">Grupo ${j.grupo} — ${j.jogo_id}</span>
          <span class="jogo-times">${j.selecao_1} x ${j.selecao_2}</span>
          ${badge}
        </div>
        ${placar}
      </div>
    </div>`;
            }).join('');

            document.getElementById('jogos-lista').innerHTML = html;
        }

        function filtrarJogos(filtro, btn) {
            filtroJogos = filtro;
            document.querySelectorAll('#page-jogos .filtro-btn').forEach(b => b.classList.remove('ativo'));
            btn.classList.add('ativo');
            renderJogos();
        }

        // ============================================================
        // RENDER DETALHES POR JOGO
        // ============================================================
        function renderDetalhes() {
            const jogos = DATA.jogos.filter(j => j.status === 'ENCERRADO');
            const pont = DATA.pontuacao;

            if (!jogos.length) {
                document.getElementById('detalhes-lista').innerHTML =
                    '<div class="loading"><span>⏳ Nenhum jogo encerrado ainda. Aguarde os resultados!</span></div>';
                return;
            }

            const headers = pont.length ? Object.keys(pont[0]) : [];

            const html = jogos.map(j => {
                const id = j.jogo_id;
                const PTS_EXATO = 10, PTS_VENC = 5, PTS_EMP = 3;

                let exatos = 0, vencedores = 0, empates = 0, erros = 0;

                const partsHTML = pont.map(p => {
                    const g1k = id + '_pts';
                    const pts = parseInt(p[g1k]) || 0;

                    // pega palpite — busca coluna de pontuação
                    let badgeClass = 'b-erro', badgeText = '0pts ✗';
                    if (pts === PTS_EXATO) { badgeClass = 'b-exato'; badgeText = '10pts ✓'; exatos++; }
                    else if (pts === PTS_VENC) { badgeClass = 'b-venc'; badgeText = '5pts ⚡'; vencedores++; }
                    else if (pts === PTS_EMP) { badgeClass = 'b-empate'; badgeText = '3pts ≈'; empates++; }
                    else { erros++; }

                    return `<div class="part-row">
        <span class="part-nome">${p.nome || p.email || '-'}</span>
        <div class="part-right">
          <span class="badge ${badgeClass}">${badgeText}</span>
        </div>
      </div>`;
                }).join('');

                const total = pont.length;

                return `<div class="jogo-card">
      <div class="jogo-card-header" onclick="toggleDetalhes(this)">
        <div class="jogo-info">
          <span class="jogo-id-badge">Grupo ${j.grupo} — ${id}</span>
          <span class="jogo-times">${j.selecao_1} x ${j.selecao_2}</span>
        </div>
        <span class="jogo-placar-real">${j.gols_1} x ${j.gols_2}</span>
      </div>
      <div class="jogo-stats">
        <span class="jogo-stat"><span class="badge b-exato">Exato</span> ${exatos} pessoas</span>
        <span class="jogo-stat"><span class="badge b-venc">Vencedor</span> ${vencedores} pessoas</span>
        <span class="jogo-stat"><span class="badge b-empate">Empate</span> ${empates} pessoas</span>
        <span class="jogo-stat"><span class="badge b-erro">Errou</span> ${erros} pessoas</span>
      </div>
      <div class="participantes-lista">${partsHTML || '<div style="padding:12px 16px;color:var(--cinza);font-size:13px">Nenhum palpite registrado.</div>'}</div>
    </div>`;
            }).join('');

            document.getElementById('detalhes-lista').innerHTML = html;
        }

        function toggleDetalhes(header) {
            const lista = header.nextElementSibling.nextElementSibling;
            lista.classList.toggle('aberto');
        }

        function filtrarDetalhes(filtro, btn) {
            filtroDetalhes = filtro;
            document.querySelectorAll('#page-detalhes .filtro-btn').forEach(b => b.classList.remove('ativo'));
            btn.classList.add('ativo');
            renderDetalhes();
        }

        // ============================================================
        // RENDER STATS
        // ============================================================
        function renderStats() {
            const d = DATA.stats;
            if (!d.length) return;

            const maxExatos = Math.max(...d.map(p => parseInt(p.placares_exatos) || 0));
            const maxTaxa = Math.max(...d.map(p => parseInt(p.taxa_acerto) || 0));
            const maxRodada = Math.max(...d.map(p => parseInt(p.melhor_rodada) || 0));
            const reiPlacar = d.find(p => parseInt(p.placares_exatos) === maxExatos);

            document.getElementById('stats-cards').innerHTML = `
    <div class="card">
      <div class="card-label">👑 Rei do Placar</div>
      <div class="card-value">${maxExatos}</div>
      <div class="card-sub">placares exatos — ${reiPlacar?.nome || '-'}</div>
    </div>
    <div class="card">
      <div class="card-label">🎯 Maior Taxa de Acerto</div>
      <div class="card-value">${maxTaxa}<span style="font-size:16px;color:var(--cinza)">%</span></div>
      <div class="card-sub">${d.find(p => parseInt(p.taxa_acerto) === maxTaxa)?.nome || '-'}</div>
    </div>
    <div class="card">
      <div class="card-label">🔥 Melhor Rodada</div>
      <div class="card-value">${maxRodada}<span style="font-size:16px;color:var(--cinza)">pts</span></div>
      <div class="card-sub">${d.find(p => parseInt(p.melhor_rodada) === maxRodada)?.nome || '-'}</div>
    </div>
    <div class="card">
      <div class="card-label">👥 Participantes</div>
      <div class="card-value">${d.length}</div>
      <div class="card-sub">no bolão</div>
    </div>
  `;

            const rows = d.map((p, i) => `<tr>
    <td class="pos-num">${i + 1}</td>
    <td class="nome-cell">${p.nome || '-'}</td>
    <td class="pts-cell">${p.total_pontos || 0}</td>
    <td><span class="badge b-exato">${p.placares_exatos || 0}</span></td>
    <td style="color:var(--dourado)">${p.taxa_acerto || 0}%</td>
  </tr>`).join('');

            document.getElementById('stats-table').innerHTML = `
    <table>
      <thead><tr>
        <th>#</th><th>Nome</th><th>Pts</th><th>Exatos</th><th>Taxa</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

            const maxT = Math.max(...d.map(p => parseInt(p.taxa_acerto) || 0)) || 1;
            const cores = ['#F5C518', '#27AE60', '#3498DB', '#E74C3C', '#8E44AD', '#E67E22'];

            document.getElementById('stats-barras').innerHTML = d.map((p, i) => {
                const pct = parseInt(p.taxa_acerto) || 0;
                const w = Math.round((pct / maxT) * 100);
                const cor = cores[i % cores.length];
                return `<div class="barra-row">
      <span class="barra-nome">${p.nome || '-'}</span>
      <div class="barra-track">
        <div class="barra-fill" style="width:${w}%;background:${cor}">
          <span class="barra-pct">${pct}%</span>
        </div>
      </div>
    </div>`;
            }).join('');
        }

        // ============================================================
        // CARREGAR DADOS
        // ============================================================
        async function carregarTudo() {
            try {
                const [ranking, pontuacao, jogos, stats] = await Promise.all([
                    fetchCSV(URLS.ranking),
                    fetchCSV(URLS.pontuacao),
                    fetchCSV(URLS.jogos),
                    fetchCSV(URLS.stats)
                ]);

                DATA = { ranking, pontuacao, jogos, stats };

                renderRanking();
                renderJogos();
                renderDetalhes();
                renderStats();

                const now = new Date();
                document.getElementById('ultimo-update').textContent =
                    'Atualizado ' + now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            } catch (e) {
                console.error('Erro ao carregar dados:', e);
                document.getElementById('ultimo-update').textContent = 'Erro ao atualizar';
            }
        }

        // ============================================================
        // NAVEGAÇÃO
        // ============================================================
        function trocarPagina(id, tabEl) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('ativo'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
            document.getElementById('page-' + id).classList.add('ativo');
            tabEl.classList.add('ativo');
        }

        function toggleTV() {
            document.body.classList.toggle('tv-mode');
            const btn = document.querySelector('.tv-btn');
            btn.textContent = document.body.classList.contains('tv-mode') ? '❌ Sair TV' : '📺 Modo TV';
        }

        // ============================================================
        // INIT
        // ============================================================
        carregarTudo();
        setInterval(carregarTudo, INTERVAL);
    </script>
</body>

</html>
